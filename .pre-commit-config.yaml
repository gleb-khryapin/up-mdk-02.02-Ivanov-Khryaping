# Проверки запускаются автоматически перед каждым коммитом.
# Установка: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: Проверка стиля интерфейса
        entry: npm run lint --workspace frontend --if-present
        language: system
        files: ^src/frontend/.*\.(ts|tsx)$
        pass_filenames: false
